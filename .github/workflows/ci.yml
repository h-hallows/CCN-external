name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # No registry auth, deliberately. @h-hallows/core is pinned to a git tag over
      # https on a public repository, so nothing here needs a token.
      #
      # This used to configure GitHub Packages and pass a GITHUB_PACKAGES_TOKEN secret.
      # That could never have worked: GitHub Packages requires the npm scope to match
      # the repository owner, and the package was never published there. The secret did
      # not exist, npm ci ignored the registry setting for a git dependency, and the
      # build passed for a reason unrelated to the configuration.
      - run: npm ci

      # I9 and the forbidden identifiers. The statutory directory is excepted for the
      # statutory phrases only; the advertising bans hold even there.
      - name: Copy lint
        run: npm run lint:copy

      # The trading name is blocked on counsel, so nothing may hardcode one.
      - name: Brand lint
        run: npm run lint:brand

      - name: Typecheck
        run: npm run typecheck

      # W6 is in here: the request-flow gates assert that no module reachable from
      # app/(client) writes to referrals, timeline_entries or disclosures, and that no
      # copy on the request path implies a placement was made. Web build spec § 10 names
      # it one of the two milestones to review twice.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # This repository is a consumer. The schema has exactly one owner: @h-hallows/core, in
  # its own repository. Neither this app nor the console may carry a migration.
  migrations-have-one-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No migrations, no drizzle-kit, no second credential engine
        run: |
          set -e
          if [ -d migrations ]; then
            echo "A migrations directory exists. Migrations belong to @h-hallows/core."
            exit 1
          fi
          if grep -q '"drizzle-kit"' package.json; then
            echo "drizzle-kit is a dependency. Only @h-hallows/core may generate migrations."
            exit 1
          fi
          if grep -rq 'export function eligibility' app components lib 2>/dev/null; then
            echo "A local eligibility() exists. There must be exactly one, in core."
            exit 1
          fi
          echo "ok: this repository consumes the schema, it does not own it"

  # § 1812.533(c): a record of every advertisement, with date and publication, kept one
  # year. A website is an advertisement and it changes every deploy.
  record-advertisement:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record this deploy as an advertisement
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL secret; skipping. Set it so the § 1812.533(c) log is kept."
            exit 0
          fi
          node scripts/record-advertisement.mjs --publication website \
            --reference "$GITHUB_SHA" --recorded-by ci
